<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyWisely - Get started</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<!--Navigation bar-->
<nav class="navbar">
  <!--Logo-->
  <div class="logo-container">
        <img src="assets/moneywisely-icon.svg" class="logo-img" alt="">
        <div class="text-block">
    <span class="logo-text">Money<span class="logo-accent">Wisely</span></span>
    <span class="short-description">STUDENT WORKSPACE</span>
    </div>
  </div>
  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="#get-started">Get Started</a></li>

  </ul>
  


</nav>


  <!-- Page header -->
   <div id="landingView">
  <header class="hero glass" id="home">
    <h1>Welcome to MoneyWisely</h1>
    <p>Try MoneyWisely in demo mode where no passwords are needed. Track your campus-life expenses</p>
    <a href="#get-started" class="btn-1" id="getStartedButton">Get Started</a>
  </header>
</div>

  <!-- Display-name input form/ sign-in card -->
  <section id="signInCardView" class="hidden glass">
    <!-- "id" is used by app.js to read the form-->
    <form id="signInForm">
      <label for="username-field">Display name</label>
      <input type="text" id="username-field" name="displayname" placeholder="Maya" maxlength="20" required>
      <button class="btn-2" type="submit">Continue</button>
    </form>

    <div class="note">
      <p>This demo stores data only in this browser</p>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2026 MoneyWisely. All rights reserved by Maya</p>
    <p>A student project</p>
  </footer>

<!-- script tag used to connect this HTML file to app.js-->
  <script src="js/app.js"></script>
</body>

</html>
